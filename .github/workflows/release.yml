name: Release

# Releases happen on their own. Every push to main updates one release pull request, kept by release-please from the
# conventional commits since the last release: it bumps the version in package.json, Cargo.toml, tauri.conf.json and
# Cargo.lock, and writes CHANGELOG.md (feat is a minor version before 1.0, fix a patch). Merging that pull request:
#
#   1. tags the release and opens it as a draft with the changelog as its notes
#   2. builds the installers on every platform and attaches them (build.yml)
#   3. publishes the release once every build has passed; a failed build leaves the draft for a look
#   4. the phone apps, when something they are built from changed: Android to the Play track PRODUCTION_APP_TRACK
#      (open testing by default) with its APK attached to the release, and iOS to TestFlight. docs/mobile.md has the
#      secrets and the switches. A hand run below rebuilds the installers only; the phone workflows run by hand too.
#
# Branches: feature branches merge into dev, where every merge with a feat or fix publishes a beta (beta.yml); dev
# merges into main with a merge commit, which is what this workflow releases.
#
# Run it by hand with a tag (Actions, Release, Run workflow) to build and attach installers to an existing release again.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to build again, such as v0.5.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      prs-created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please cannot run cargo, so the workspace crates' versions in Cargo.lock are moved on the release branch
  # here. A push with this workflow's token starts no other workflow, so this never loops.
  lockfile:
    name: Cargo.lock on the release pull request
    needs: release-please
    if: needs.release-please.outputs.prs-created == 'true' && needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - name: Move the workspace crates to the new version
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo update --workspace
          if git diff --quiet Cargo.lock; then echo "Cargo.lock already matches."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Cargo.lock for the release" -- Cargo.lock
          git push

  build:
    name: Installers
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/build.yml
    # The updater's signing key, and Apple's when it exists.
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag || inputs.tag }}
      beta: ${{ contains(needs.release-please.outputs.tag || inputs.tag, '-') }}

  publish:
    name: Publish the release
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the draft as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Buun Mail $TAG" --draft=false --latest

  # The phone apps, once the stable release is out. Each is skipped when its repository variable is "false"
  # (SHIP_ANDROID, SHIP_IOS), when its secrets are missing, or when nothing the app is built from changed since the
  # last stable release that shipped it (tools/mobile-impact.mjs against the android-stable and ios-stable tags).
  mobile-changes:
    name: Phone apps changed?
    needs: [release-please, publish]
    if: needs.publish.result == 'success' && (vars.SHIP_ANDROID != 'false' || vars.SHIP_IOS != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.android.outputs.impacted }}
      ios: ${{ steps.ios.outputs.impacted }}
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Android, since android-stable
        id: android
        run: node tools/mobile-impact.mjs android --base android-stable --head "$TAG"
      - name: iOS, since ios-stable
        id: ios
        run: node tools/mobile-impact.mjs ios --base ios-stable --head "$TAG"

  # Open testing (beta) by default; PRODUCTION_APP_TRACK names another track, such as production once Google has
  # granted production access. The universal APK goes on the release.
  android:
    name: Android to Play ${{ vars.PRODUCTION_APP_TRACK || 'beta' }}
    needs: [release-please, publish, mobile-changes]
    if: >-
      always() && needs.publish.result == 'success' && vars.SHIP_ANDROID != 'false'
      && (needs.mobile-changes.outputs.android == 'true' || needs.mobile-changes.result == 'failure')
    uses: ./.github/workflows/mobile-android.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      track: ${{ vars.PRODUCTION_APP_TRACK || 'beta' }}
      skip-without-secrets: true

  ios:
    name: iOS to TestFlight
    needs: [release-please, publish, mobile-changes]
    if: >-
      always() && needs.publish.result == 'success' && vars.SHIP_IOS != 'false'
      && (needs.mobile-changes.outputs.ios == 'true' || needs.mobile-changes.result == 'failure')
    uses: ./.github/workflows/mobile-ios.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      skip-without-secrets: true

  # What the next stable release is compared with, moved only after a publish that reached the store.
  mobile-tags:
    name: Record what the phone apps were built from
    needs: [release-please, android, ios]
    if: always() && (needs.android.outputs.published == 'true' || needs.ios.outputs.uploaded == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Move android-stable and ios-stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          ANDROID: ${{ needs.android.outputs.published == 'true' }}
          IOS: ${{ needs.ios.outputs.uploaded == 'true' }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          move() {
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$1" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$1" -f sha="$sha" -F force=true > /dev/null || return 1
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$1" -f sha="$sha" > /dev/null || return 1
            fi
            echo "$1 is now $sha ($TAG)."
          }
          # Bookkeeping only: if a tag cannot move, the next release builds that app again, so it must not fail the run.
          if [ "$ANDROID" = "true" ]; then move android-stable || echo "::warning::Could not move android-stable. The next release builds Android again."; fi
          if [ "$IOS" = "true" ]; then move ios-stable || echo "::warning::Could not move ios-stable. The next release builds iOS again."; fi
