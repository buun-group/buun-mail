name: Release

# Builds the desktop app for every platform and attaches the installers to a draft GitHub release. Runs on a version
# tag (v0.2.0) or by hand. Nothing is published until the owner turns the draft into a release.
#
#   Linux x86_64  .deb (Debian, Ubuntu), .rpm (Fedora, openSUSE), .AppImage (any distribution, Arch included)
#   macOS Apple silicon and Intel  .dmg and .app
#   Windows x86_64  .msi and the NSIS setup .exe
#
# Arch users can also build from source with packaging/arch/PKGBUILD.
#
# Linux arm64: GitHub's free arm runners serve public repositories only. When this repository is public, or has
# larger runners, add `{ name: Linux arm64, runner: ubuntu-24.04-arm, args: '' }` to the matrix.
#
# Make a release with `pnpm release 0.2.0`, then `git push --follow-tags`. The tag must match the app version.
#
# Signing is optional and off until the secrets exist: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID for macOS notarisation; TAURI_SIGNING_PRIVATE_KEY and its password for the
# updater. Unsigned builds run, but macOS and Windows warn on first open.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            args: ''
          - name: macOS Apple silicon
            runner: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-latest
            args: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the app version $version. Run pnpm release <version> to make a matching tag."
            exit 1
          fi

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf rpm

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}-${{ matrix.target }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: Buun Mail ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: Installers for Linux, macOS and Windows. See the README for which file to pick.
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' }}
