name: Mobile Android
run-name: Android ${{ inputs.tag }} to Play ${{ inputs.track || 'internal' }}

# Builds the Android app for one release tag, signed with the upload key, and:
#
#   1. attaches the universal APK to that tag's GitHub release (Buun.Mail_<version>_android.apk), for anyone who
#      installs by hand
#   2. publishes the .aab to a Google Play track with tools/play-ship.mjs (internal, alpha = closed testing,
#      beta = open testing, production)
#
# The version name is the tag's version (0.6.0-beta.2 stays as it is) and the version code the minutes since
# 2020-01-01 UTC, from tools/mobile-version.mjs, so every build is higher than the last and Play accepts it.
#
# Called by beta.yml (internal testing) and release.yml (PRODUCTION_APP_TRACK), or run by hand: Actions, Mobile
# Android, Run workflow, with an existing release tag.
#
# Secrets (Settings, Secrets and variables, Actions; docs/mobile.md says where each comes from):
#   ANDROID_KEYSTORE_BASE64      the upload keystore (.jks), base64
#   ANDROID_KEYSTORE_PASSWORD    its store password
#   ANDROID_KEY_ALIAS            the key's alias in it
#   ANDROID_KEY_PASSWORD         the key's password
#   PLAY_SERVICE_ACCOUNT_JSON    the Play service-account key file, pasted whole (not base64)
# Without the keystore a hand run fails and a release run skips with a notice. Without the Play key the APK is
# still attached and the Play publish is skipped with a notice.
# Optional variable: PLAY_HOLD_FOR_REVIEW "true" saves closed, open and production releases without sending them to
# Google's review (Play decides whether it allows that).

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.6.0 or v0.6.0-beta.2
        required: true
        type: string
      track:
        description: The Play track
        required: false
        type: string
        default: internal
      notes:
        description: Release notes on Play (default a line linking the GitHub release)
        required: false
        type: string
        default: ''
      skip-without-secrets:
        description: True to skip with a notice, not fail, when the signing secrets are missing
        required: false
        type: boolean
        default: false
    outputs:
      published:
        description: '"true" when the bundle reached the Play track'
        value: ${{ jobs.play.outputs.published }}
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, such as v0.6.0 or v0.6.0-beta.2
        required: true
        type: string
      track:
        description: The Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      notes:
        description: Release notes on Play (default a line linking the GitHub release)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # `secrets` cannot be read in a job condition, so their presence is worked out here, once.
  secrets:
    name: Android secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signing: ${{ steps.check.outputs.signing }}
      play: ${{ steps.check.outputs.play }}
    steps:
      - name: Which secrets exist
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SKIP: ${{ inputs.skip-without-secrets }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "play=false" >> "$GITHUB_OUTPUT"
            if [ "$SKIP" = "true" ]; then
              echo "::notice title=Android skipped::Missing secrets:$missing. The Android app is not built until they exist (docs/mobile.md)."
              exit 0
            fi
            echo "::error title=Android signing::Missing secrets:$missing. A release build must be signed with the upload key; docs/mobile.md says how to make it."
            exit 1
          fi
          echo "signing=true" >> "$GITHUB_OUTPUT"
          if [ -z "$PLAY_KEY" ]; then
            echo "play=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Play skipped::PLAY_SERVICE_ACCOUNT_JSON is not set, so the APK is attached to the release but nothing goes to Google Play."
          else
            echo "play=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the signed app
    needs: secrets
    if: needs.secrets.outputs.signing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.build }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: The version name and code
        id: version
        run: node tools/mobile-version.mjs android "$TAG"

      # Tauri 2's Android project builds with Gradle 8 on JDK 17.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # The default package list is enough; Gradle fetches the platform and build tools compileSdk names.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Android NDK 27
        run: |
          sdkmanager --install "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Rust toolchain from rust-toolchain.toml, with the Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Outside the workspace, and removed at the end on every outcome. keytool reads the password from the
      # environment (-storepass:env), so it never reaches a command line.
      - name: The upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Android signing::ANDROID_KEYSTORE_BASE64 is not a keystore that ANDROID_KEYSTORE_PASSWORD opens with the alias ANDROID_KEY_ALIAS. Make the secret with base64 -w0 upload.jks."
            exit 1
          fi

      - name: Build the .aab and .apk
        env:
          CONFIG: ${{ steps.version.outputs.config }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm build:android --ci --aab --apk --config "$CONFIG"

      # Tauri builds one universal bundle and APK holding all four ABIs. The APK must carry a signature, or the
      # release would offer a file no phone installs.
      - name: Find and check the outputs
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          outputs=apps/desktop/src-tauri/gen/android/app/build/outputs
          aab=$(find "$outputs/bundle" -name '*.aab' -path '*universalRelease*' | head -n1)
          apk=$(find "$outputs/apk" -name '*.apk' -path '*universal/release*' | head -n1)
          if [ -z "$aab" ] || [ -z "$apk" ]; then
            echo "::error::The build finished without a universal release .aab and .apk under $outputs."
            find "$outputs" -type f
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          if ! "$apksigner" verify --print-certs "$apk" > /dev/null; then
            echo "::error::$apk is not signed. Check the keystore secrets."
            exit 1
          fi
          name="Buun.Mail_${VERSION}_android.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          cp "$aab" "$RUNNER_TEMP/buun-mail.aab"
          echo "apk=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "Built $name and the bundle ($(du -h "$aab" | cut -f1))."

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.files.outputs.apk }}
        run: gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the bundle for the Play job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buun-mail-aab
          path: ${{ runner.temp }}/buun-mail.aab
          retention-days: 14
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  play:
    name: Publish to Play ${{ inputs.track || 'internal' }}
    needs: [secrets, build]
    if: needs.secrets.outputs.play == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two Play edits at once could overwrite each other; mobile-play-promote.yml shares the group.
    concurrency:
      group: mobile-play
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buun-mail-aab
          path: ${{ runner.temp }}/aab
      - name: Publish the bundle
        id: publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track || 'internal' }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ needs.build.outputs.version }}
          HOLD: ${{ vars.PLAY_HOLD_FOR_REVIEW }}
          NOTES_LANGUAGE: ${{ vars.PLAY_NOTES_LANGUAGE }}
        run: |
          [ -n "$NOTES" ] || NOTES="Buun Mail $VERSION. What changed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          args=(--aab "$RUNNER_TEMP/aab/buun-mail.aab" --track "$TRACK" --name "$VERSION" --notes "$NOTES")
          [ "$HOLD" = "true" ] && args+=(--hold-for-review)
          [ -n "$NOTES_LANGUAGE" ] && args+=(--notes-language "$NOTES_LANGUAGE")
          node tools/play-ship.mjs "${args[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"
