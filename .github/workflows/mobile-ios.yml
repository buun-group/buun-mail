name: Mobile iOS
run-name: iOS ${{ inputs.tag }} to TestFlight

# Builds the iOS app for one release tag on a GitHub-hosted Mac and uploads it to App Store Connect, where it shows
# up in TestFlight once Apple has processed it (usually 5 to 30 minutes).
#
#   1. Apple credentials check (tools/apple-preflight.mjs, on Linux, seconds): the API key, the App ID
#      com.buungroup.mail and its App Store Connect app record, and either a stored certificate that is complete or,
#      for automatic signing, an Admin key and one registered device. Read-only; nothing is built if it fails.
#   2. On the Mac: `tauri ios init` makes the Xcode project (gen/apple is not committed), `tauri icon` writes the app
#      icon from packages/brand/assets/mobile-icon-1024.png into it, and `tauri ios build --export-method
#      app-store-connect` archives and exports the signed .ipa.
#   3. `xcrun altool --upload-app` sends the .ipa to App Store Connect with the API key.
#
# Versions: iOS takes only X.Y.Z, so a beta 0.6.0-beta.2 ships as 0.6.0. The build number is the minutes since
# 2020-01-01 UTC plus IOS_BUILD_OFFSET (tools/mobile-version.mjs), so it rises across beta.yml, release.yml and
# hand runs alike, and App Store Connect never sees one twice.
#
# Signing, two ways, chosen by whether IOS_DISTRIBUTION_CERT_P12_BASE64 is set:
#   set      Tauri signs from the stored Apple Distribution certificate and App Store profile
#            (IOS_DISTRIBUTION_CERT_P12_BASE64, IOS_DISTRIBUTION_CERT_PASSWORD, IOS_APP_PROFILE_BASE64). No Apple
#            portal call during the build, so no Admin key or registered device is needed.
#   not set  Xcode's automatic signing with the App Store Connect API key (APPLE_API_KEY, APPLE_API_ISSUER and
#            APPLE_API_KEY_PATH for Tauri): it creates the certificate and profile itself. Needs an Admin key and one
#            registered iPhone or iPad on the team.
#
# Secrets (Settings, Secrets and variables, Actions; docs/mobile.md says where each comes from):
#   APPLE_TEAM_ID                       the 10-character Team ID
#   APP_STORE_CONNECT_KEY_ID            the API key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID         the Issuer ID above the keys table
#   APP_STORE_CONNECT_API_KEY_BASE64    the AuthKey_<KEYID>.p8 file, base64
#   optional: IOS_DISTRIBUTION_CERT_P12_BASE64, IOS_DISTRIBUTION_CERT_PASSWORD, IOS_APP_PROFILE_BASE64
# Without the first four a called run skips with a notice and a hand run fails.
# Optional variable: IOS_BUILD_OFFSET, added to the build number.
#
# Runner: macos-26 (Apple silicon, Xcode 26). Apple has required the iOS 26 SDK for uploads since 2026-04-28.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.6.0 or v0.6.0-beta.2
        required: true
        type: string
      skip-without-secrets:
        description: True to skip with a notice, not fail, when the Apple secrets are missing
        required: false
        type: boolean
        default: false
    outputs:
      uploaded:
        description: '"true" when the build reached App Store Connect'
        value: ${{ jobs.build.outputs.uploaded }}
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, such as v0.6.0 or v0.6.0-beta.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Apple credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
      manual: ${{ steps.secrets.outputs.manual }}
    steps:
      - name: Which secrets exist
        id: secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          SKIP: ${{ inputs.skip-without-secrets }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$KEY" ] && missing="$missing APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$SKIP" = "true" ]; then
              echo "::notice title=iOS skipped::Missing secrets:$missing. The iOS app is not built until they exist (docs/mobile.md)."
              exit 0
            fi
            echo "::error title=Apple credentials::Missing secrets:$missing (docs/mobile.md)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$P12" ]; then echo "manual=true" >> "$GITHUB_OUTPUT"; else echo "manual=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Ask Apple, read-only
        if: steps.secrets.outputs.ready == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          DIST_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
        run: node tools/apple-preflight.mjs

  build:
    name: Build and upload to TestFlight
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    # Two uploads at once could race on build numbers; never cancel one part-way.
    concurrency:
      group: mobile-ios
      cancel-in-progress: false
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Xcode 26 or later
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::Xcode 26 or later is required for an App Store upload. Found Xcode $major."
            exit 1
          fi

      - name: The version and build number
        id: version
        env:
          OFFSET: ${{ vars.IOS_BUILD_OFFSET }}
        run: node tools/mobile-version.mjs ios "$TAG" --offset "${OFFSET:-0}"

      - name: Rust toolchain from rust-toolchain.toml, with the iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Tauri's iOS signing reads the key from APPLE_API_KEY_PATH; altool looks for AuthKey_<id>.p8 in
      # ~/.appstoreconnect/private_keys. Both are removed at the end.
      - name: The App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          file="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          if printf '%s' "$KEY" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$KEY" > "$file"; else printf '%s' "$KEY" | base64 --decode > "$file"; fi
          chmod 600 "$file"
          echo "KEY_FILE=$file" >> "$GITHUB_ENV"

      # A missing secret arrives as an empty value, and Tauri would try to sign with it, so only what this signing
      # method uses is passed on. A stored certificate makes no portal call; automatic signing needs the API key.
      - name: Signing for Tauri
        env:
          MANUAL: ${{ needs.preflight.outputs.manual }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            names="APPLE_DEVELOPMENT_TEAM IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION"
            echo "Signing from the stored distribution certificate and App Store profile."
          else
            names="APPLE_DEVELOPMENT_TEAM APPLE_API_KEY APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
            echo "Signing automatically with the App Store Connect API key."
          fi
          for name in $names; do
            delimiter="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done

      - name: Make the Xcode project
        working-directory: apps/desktop
        run: pnpm exec tauri ios init --ci

      # The phone icon is the full-bleed one (iOS rounds the corners itself). tauri icon also rewrites the desktop and
      # Android icons in this throwaway checkout, which this build does not use.
      - name: The app icon
        working-directory: apps/desktop
        run: pnpm exec tauri icon ../../packages/brand/assets/mobile-icon-1024.png

      # App Store Connect refuses a 1024 icon with an alpha channel, and an icon step that wrote nothing would ship
      # Tauri's default.
      - name: Check the App Store icon
        run: |
          icon=$(find apps/desktop/src-tauri/gen/apple -path '*AppIcon.appiconset*' -name 'AppIcon-512@2x.png' | head -n1)
          if [ -z "$icon" ]; then echo "::error::No 1024 App Store icon in gen/apple."; exit 1; fi
          python3 - "$icon" <<'PY'
          import struct, sys
          data = open(sys.argv[1], 'rb').read(33)
          width, height, depth, colour = struct.unpack('>IIBB', data[16:26])
          print(f'App Store icon {width}x{height}, colour type {colour}')
          if (width, height) != (1024, 1024):
              sys.exit('::error::The App Store icon must be 1024x1024.')
          if colour in (4, 6):
              sys.exit('::error::The App Store icon must not have an alpha channel.')
          PY

      - name: Build the signed .ipa
        env:
          CONFIG: ${{ steps.version.outputs.config }}
        run: pnpm build:ios --ci --export-method app-store-connect --config "$CONFIG"

      - name: Find the .ipa
        id: ipa
        run: |
          ipa=$(find apps/desktop/src-tauri/gen/apple/build -name '*.ipa' | head -n1)
          if [ -z "$ipa" ]; then echo "::error::The build finished without an .ipa under gen/apple/build."; exit 1; fi
          echo "path=$ipa" >> "$GITHUB_OUTPUT"
          echo "Built $ipa ($(du -h "$ipa" | cut -f1))."

      - name: Upload to App Store Connect
        id: upload
        env:
          IPA: ${{ steps.ipa.outputs.path }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          UPLOADED: ${{ steps.upload.outputs.uploaded == 'true' }}
          SIGNING: ${{ needs.preflight.outputs.manual == 'true' && 'stored certificate and profile' || 'automatic, with the API key' }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### iOS $TAG: $STATUS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | $VERSION ($BUILD) |"
            echo "| Signing | $SIGNING |"
            echo "| Uploaded to App Store Connect | $UPLOADED |"
            if [ "$UPLOADED" = "true" ]; then
              echo ""
              echo "Apple now processes the build; it shows up in TestFlight in about 5 to 30 minutes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keys
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
