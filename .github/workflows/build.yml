name: Build

# Builds the installers for one release tag on every platform and attaches them to its GitHub release (a draft is found
# by id, since a draft is not found by its tag). Called by release.yml for a stable release and beta.yml for a beta.
#
#   Linux x86_64  .deb (Debian, Ubuntu), .rpm (Fedora, openSUSE), .AppImage (any distribution, Arch included)
#   macOS Apple silicon and Intel  .dmg and .app
#   Windows x86_64  .msi and the NSIS setup .exe
#
# A beta (0.6.0-beta.2) builds the same minus .rpm and .msi: neither format accepts a pre-release version.
#
# Signing is optional and off until the secrets exist: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID for macOS notarisation. Unsigned builds run, but macOS and Windows warn on
# first open.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.6.0 or v0.6.0-beta.2
        required: true
        type: string
      beta:
        description: True for a beta, whose version is set for the build only
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            args: ''
            beta-args: --bundles deb,appimage
          - name: macOS Apple silicon
            runner: macos-latest
            args: --target aarch64-apple-darwin
            beta-args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            args: --target x86_64-apple-darwin
            beta-args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-latest
            args: ''
            beta-args: --bundles nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # A beta is never committed: its version is written into the checkout for this build only.
      - name: A beta's version, for this build
        if: inputs.beta
        shell: bash
        run: node tools/set-version.mjs "${TAG#v}"

      - name: The tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match the app version $version."
            exit 1
          fi

      # The release is a draft until every build is attached, and a draft is not found by its tag, so it is found by id.
      - name: Find the release
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then echo "::error::No release for $TAG."; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf rpm

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}-${{ matrix.target }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # A missing secret arrives as an empty value, and Tauri would try to sign with it. Only the secrets that exist are
      # passed on; without them the app is ad-hoc signed (tauri.macos.conf.json), which Apple silicon needs to run it.
      - name: Apple signing, when its secrets exist
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
            fi
          done

      # The updater's key signs each installer the app can update itself from (.sig beside it), and the action
      # gathers them into the release's latest.json, which the app reads to install in place.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: ${{ inputs.beta && matrix.beta-args || matrix.args }}
          releaseId: ${{ steps.find.outputs.id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # tauri-action writes each installer URL in latest.json as a GitHub API URL, and the API allows 60 unauthenticated
  # calls an hour per address: past that, the app's in-place update fails with 403 Forbidden. Once every build has
  # added its entry, the manifest is rewritten to the public download links, which have no such limit. The release is
  # still a draft here, so nobody reads latest.json while it is replaced.
  updater-urls:
    name: Public links in latest.json
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rewrite latest.json
        shell: bash
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then echo "::error::No release for $TAG."; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          manifest=$(jq -r '.[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/assets.json")
          if [ -z "$manifest" ]; then echo "::error::The release for $TAG has no latest.json."; exit 1; fi
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$manifest" > "$RUNNER_TEMP/latest.json"
          node tools/updater-urls.mjs "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/assets.json" "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/public.json"
          if cmp -s "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/public.json"; then echo "latest.json already uses public links."; exit 0; fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$manifest"
          gh api -X POST -H 'Content-Type: application/json' --input "$RUNNER_TEMP/public.json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=latest.json" > /dev/null
          jq -r '.platforms | to_entries[] | "\(.key)  \(.value.url)"' "$RUNNER_TEMP/public.json"

