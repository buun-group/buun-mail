<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 700" width="305" height="700" role="img" aria-labelledby="dg-title dg-desc" aria-description="Shipping an update: 6 nodes, 5 connections. Pull the new code and install it, migrate the database first because migrations only add, then upload a new version that takes no traffic. Check its health URL. If it answers, promote it; if it does not, or a promoted version misbehaves, roll back to the one before." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="light"><title id="dg-title">Shipping an update</title><desc id="dg-desc">Shipping an update: 6 nodes, 5 connections. Pull the new code and install it, migrate the database first because migrations only add, then upload a new version that takes no traffic. Check its health URL. If it answers, promote it; if it does not, or a promoted version misbehaves, roll back to the one before.
Nodes:
- Pull and install (git pull, pnpm install), step
- Migrate (db:migrate), step
- Upload (No traffic yet), step
- Health answers? (/health on its URL), decision
- Promote, terminal
- Roll back, terminal
Connections:
- Pull and install to Migrate
- Migrate to Upload
- Upload to Health answers?
- Health answers? to Promote: yes
- Health answers? to Roll back (dashed): no, or later trouble</desc><metadata data-format="buun-diagram">flow "Shipping an update" direction=down desc="Pull the new code and install it, migrate the database first because migrations only add, then upload a new version that takes no traffic. Check its health URL. If it answers, promote it; if it does not, or a promoted version misbehaves, roll back to the one before."

node pull step "Pull and install" sub="git pull, pnpm install" icon=lucide:git-pull-request
node migrate step "Migrate" sub="db:migrate" icon=cloudflare:d1
node upload step "Upload" sub="No traffic yet" icon=cloudflare:workers
node check decision "Health answers?" sub="/health on its URL"
node promote terminal "Promote"
node rollback terminal "Roll back"

pull -&gt; migrate
migrate -&gt; upload
upload -&gt; check
check -&gt; promote : "yes"
check --&gt; rollback : "no, or later trouble"
</metadata><defs><filter id="dg-lift" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05"/><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" result="lifted"/><feOffset in="SourceAlpha" dy="1" result="below"/><feComposite in="SourceAlpha" in2="below" operator="out" result="edge"/><feFlood flood-color="#ffffff" flood-opacity="0"/><feComposite in2="edge" operator="in" result="rim"/><feMerge><feMergeNode in="lifted"/><feMergeNode in="rim"/></feMerge></filter></defs><g data-edge="e0" data-from="pull" data-to="migrate"><path d="M152 92L152 156" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M147.5 148.25L152 155.25L156.5 148.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e1" data-from="migrate" data-to="upload"><path d="M152 224L152 288" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M147.5 280.25L152 287.25L156.5 280.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e2" data-from="upload" data-to="check"><path d="M152 356L152 420" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M147.5 412.25L152 419.25L156.5 412.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e3" data-from="check" data-to="promote"><path d="M123 488L123 498Q123 508 113 508L96 508Q86 508 86 518L86 640" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M81.5 632.25L86 639.25L90.5 632.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="e4" data-from="check" data-to="rollback"><path d="M180 488L180 498Q180 508 190 508L206 508Q216 508 216 518L216 640" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M211.5 632.25L216 639.25L220.5 632.25" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-node="pull" data-type="step"><rect x="61" y="24" width="182" height="68" rx="12" fill="#ffffff" stroke="#dad9d2" stroke-width="1" filter="url(#dg-lift)"/><rect x="75" y="44" width="28" height="28" rx="8" fill="#eaeaea"/><g transform="translate(81 50) scale(0.67)" aria-hidden="true" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/></g><text x="113" y="53.73" font-size="13" font-weight="600" fill="#171716" textLength="90.59" lengthAdjust="spacingAndGlyphs">Pull and install</text><text x="113" y="72.36" font-size="12" font-weight="400" fill="#52514e" textLength="113.13" lengthAdjust="spacingAndGlyphs">git pull, pnpm install</text></g><g data-node="migrate" data-type="step"><rect x="87" y="156" width="130" height="68" rx="12" fill="#ffffff" stroke="#dad9d2" stroke-width="1" filter="url(#dg-lift)"/><rect x="101" y="176" width="28" height="28" rx="8" fill="#eaeaea"/><g transform="translate(107 182) scale(0.67)" aria-hidden="true" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="139" y="185.73" font-size="13" font-weight="600" fill="#171716" textLength="48.43" lengthAdjust="spacingAndGlyphs">Migrate</text><text x="139" y="204.37" font-size="12" font-weight="400" fill="#52514e" textLength="61.11" lengthAdjust="spacingAndGlyphs">db:migrate</text></g><g data-node="upload" data-type="step"><rect x="80" y="288" width="143" height="68" rx="12" fill="#ffffff" stroke="#dad9d2" stroke-width="1" filter="url(#dg-lift)"/><rect x="94" y="308" width="28" height="28" rx="8" fill="#eaeaea"/><g transform="translate(100 314) scale(0.67)" aria-hidden="true" fill="#52514e"><path d="m8.213.063 8.879 12.136-8.67 11.739h2.476l8.665-11.735-8.89-12.14Zm4.728 0 9.02 11.992-9.018 11.883h2.496L24 12.656v-1.199L15.434.063ZM7.178 2.02.01 11.398l-.01 1.2 7.203 9.644 1.238-1.676-6.396-8.556 6.361-8.313Z"/></g><text x="132" y="317.73" font-size="13" font-weight="600" fill="#171716" textLength="44.57" lengthAdjust="spacingAndGlyphs">Upload</text><text x="132" y="336.37" font-size="12" font-weight="400" fill="#52514e" textLength="74.48" lengthAdjust="spacingAndGlyphs">No traffic yet</text></g><g data-node="check" data-type="decision"><rect x="65" y="420" width="173" height="68" rx="12" fill="#fdf6e6" stroke="#be8100" stroke-width="1" filter="url(#dg-lift)"/><rect x="79" y="440" width="28" height="28" rx="8" fill="#ffffff"/><g transform="translate(85 446) scale(0.67)" aria-hidden="true" fill="none" stroke="#9d6c04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g><text x="117" y="449.73" font-size="13" font-weight="600" fill="#171716" textLength="104.6" lengthAdjust="spacingAndGlyphs">Health answers?</text><text x="117" y="468.37" font-size="12" font-weight="400" fill="#52514e" textLength="100.1" lengthAdjust="spacingAndGlyphs">/health on its URL</text></g><g data-node="promote" data-type="terminal"><rect x="35" y="640" width="102" height="36" rx="18" fill="#ffffff" stroke="#898781" stroke-width="1" filter="url(#dg-lift)"/><text x="86" y="662.73" font-size="13" font-weight="600" fill="#171716" text-anchor="middle" textLength="53.36" lengthAdjust="spacingAndGlyphs">Promote</text></g><g data-node="rollback" data-type="terminal"><rect x="165" y="640" width="102" height="36" rx="18" fill="#ffffff" stroke="#898781" stroke-width="1" filter="url(#dg-lift)"/><text x="216" y="662.73" font-size="13" font-weight="600" fill="#171716" text-anchor="middle" textLength="57.03" lengthAdjust="spacingAndGlyphs">Roll back</text></g><g data-edge-label="e3"><rect x="53" y="552" width="65" height="24" rx="11" fill="#ffffff" stroke="#dad9d2" stroke-width="1"/><g transform="translate(65.29 557) scale(0.58)" aria-hidden="true" fill="none" stroke="#008300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="85.29" y="568.37" font-size="12" font-weight="500" fill="#52514e" textLength="20.41" lengthAdjust="spacingAndGlyphs">yes</text></g><g data-edge-label="e4"><rect x="151" y="552" width="130" height="24" rx="11" fill="#ffffff" stroke="#dad9d2" stroke-width="1"/><text x="216" y="568.37" font-size="12" font-weight="500" fill="#52514e" text-anchor="middle" textLength="105.88" lengthAdjust="spacingAndGlyphs">no, or later trouble</text></g></svg>