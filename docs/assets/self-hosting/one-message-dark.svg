<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 971 664" width="971" height="664" role="img" aria-labelledby="dg-title dg-desc" aria-description="One message, start to finish: 6 participants. A sender delivers to an address on your domain. Email Routing passes it to the gateway with its envelope recipient. The gateway stores it in D1 and has the notifier tell the app over the WebSocket. The app collects: one request returns the message itself. It files it by recipient, and its next collect acknowledges it, so the gateway deletes its copy." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="dark"><title id="dg-title">One message, start to finish</title><desc id="dg-desc">One message, start to finish: 6 participants. A sender delivers to an address on your domain. Email Routing passes it to the gateway with its envelope recipient. The gateway stores it in D1 and has the notifier tell the app over the WebSocket. The app collects: one request returns the message itself. It files it by recipient, and its next collect acknowledges it, so the gateway deletes its copy.
Participants:
- Sender, external
- Email Routing, gateway
- Gateway, function
- D1, database
- Notifier, service
- Buun Mail, client
Steps:
- 1. Sender to Email Routing: to hi@example.com
- 2. Email Routing to Gateway: catch-all
- 3. Gateway to D1: store
- 4. Gateway to Notifier (dotted): new mail
- 5. Notifier to Buun Mail (dotted): WebSocket
- 6. Buun Mail to Gateway: collect
- 7. Gateway to Buun Mail (dashed): the .eml, inline
- Note over Buun Mail: Filed by recipient
- 8. Buun Mail to Gateway: collect, ack
- 9. Gateway to D1: delete
- 10. Gateway to Buun Mail (dashed): nothing left</desc><metadata data-format="buun-diagram">sequence "One message, start to finish" numbered=on desc="A sender delivers to an address on your domain. Email Routing passes it to the gateway with its envelope recipient. The gateway stores it in D1 and has the notifier tell the app over the WebSocket. The app collects: one request returns the message itself. It files it by recipient, and its next collect acknowledges it, so the gateway deletes its copy."

actor sender external "Sender"
actor routing gateway "Email Routing" icon=cloudflare:email-routing
actor gw function "Gateway" icon=cloudflare:workers
actor db database "D1" icon=cloudflare:d1
actor notifier service "Notifier" icon=cloudflare:durable-objects
actor app client "Buun Mail" icon=lucide:monitor

sender -&gt; routing : "to hi@example.com"
routing -&gt; gw : "catch-all"
gw -&gt; db : "store"
gw ..&gt; notifier : "new mail"
notifier ..&gt; app : "WebSocket"
app -&gt; gw : "collect"
gw --&gt; app : "the .eml, inline"
note over app : "Filed by recipient"
app -&gt; gw : "collect, ack"
gw -&gt; db : "delete"
gw --&gt; app : "nothing left"
