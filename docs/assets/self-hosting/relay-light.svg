<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 644" width="809" height="644" role="img" aria-labelledby="dg-title dg-desc" aria-description="Mail through a relay: 4 participants. For a domain in a second Cloudflare account, that account's Email Routing hands the message to the relay, which posts it to your gateway with its relay key. A stored message is done. A refusal for good bounces to the sender. A wrong key, a rate limit, a gateway error or no answer tells the sending server to try again later, so no mail is lost." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="light"><title id="dg-title">Mail through a relay</title><desc id="dg-desc">Mail through a relay: 4 participants. For a domain in a second Cloudflare account, that account's Email Routing hands the message to the relay, which posts it to your gateway with its relay key. A stored message is done. A refusal for good bounces to the sender. A wrong key, a rate limit, a gateway error or no answer tells the sending server to try again later, so no mail is lost.
Participants:
- Sending server, external
- Email Routing (Second account), gateway
- Relay, function
- Gateway (Your account), function
Steps:
- 1. Sending server to Email Routing: mail to hi@other.example
- 2. Email Routing to Relay: catch-all
- 3. Relay to Gateway: POST /v1/relay/messages, relay key
- alt: 2xx
  - 4. Gateway to Relay (dashed): stored
  - 5. Relay to Email Routing (dashed): accepted
- else: 4xx, such as a domain the mailbox does not own
  - 6. Gateway to Relay (dashed): refused
  - 7. Relay to Sending server (dashed): bounce
- else: 401, 429, 5xx or no answer
  - 8. Relay to Sending server (dashed): try again later</desc><metadata data-format="buun-diagram">sequence "Mail through a relay" desc="For a domain in a second Cloudflare account, that account's Email Routing hands the message to the relay, which posts it to your gateway with its relay key. A stored message is done. A refusal for good bounces to the sender. A wrong key, a rate limit, a gateway error or no answer tells the sending server to try again later, so no mail is lost."

actor sender external "Sending server"
actor routing gateway "Email Routing" sub="Second account" icon=cloudflare:email-routing
actor relay function "Relay" icon=cloudflare:workers
actor gw function "Gateway" sub="Your account" icon=cloudflare:workers

sender -&gt; routing : "mail to hi@other.example"
routing -&gt; relay : "catch-all"
relay -&gt; gw : "POST /v1/relay/messages, relay key"

alt "2xx" {
  gw --&gt; relay : "stored"
  relay --&gt; routing : "accepted"
} else "4xx, such as a domain the mailbox does not own" {
  gw --&gt; relay : "refused"
  relay --&gt; sender : "bounce"
} else "401, 429, 5xx or no answer" {
  relay --&gt; sender : "try again later"
}
