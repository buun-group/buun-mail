und"/><path d="M704.07 244.5L711.07 240L704.07 235.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="588.41" y="231" font-size="12" font-weight="500" fill="#171716" text-anchor="middle" textLength="206.82" lengthAdjust="spacingAndGlyphs">POST /v1/relay/messages, relay key</text></g><g data-message="stored"><path d="M711.82 316L465 316" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M472.75 311.5L465.75 316L472.75 320.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="588.41" y="307" font-size="12" font-weight="500" fill="#171716" text-anchor="middle" textLength="36.9" lengthAdjust="spacingAndGlyphs">stored</text></g><g data-message="accepted"><path d="M465 362L296.5 362" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M304.25 357.5L297.25 362L304.25 366.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380.75" y="353" font-size="12" font-weight="500" fill="#171716" text-anchor="middle" textLength="53.68" lengthAdjust="spacingAndGlyphs">accepted</text></g><g data-message="refused"><path d="M711.82 438L465 438" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M472.75 433.5L465.75 438L472.75 442.5" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="588.41" y="429" font-size="12" font-weight="500" fill="#171716" text-anchor="middle" textLength="44.39" lengthAdjust="spacingAndGlyphs">refused</text></g><g data-message="bounce"><path d="M465 484L301.5 484M291.5 484L106 484" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M301.5 484A5 5 