<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 478 991" width="478" height="991" role="img" aria-labelledby="dg-title dg-desc" aria-description="How the gateway fits together: 6 nodes, 6 connections. Senders deliver to your domains. Cloudflare Email Routing hands each message to the mail gateway, an Email Worker in your account, which stores it in D1 with its envelope recipient and wakes a notifier. The notifier tells Buun Mail over a WebSocket, and the gateway hands the message over and then forgets it." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="light"><title id="dg-title">How the gateway fits together</title><desc id="dg-desc">How the gateway fits together: 6 nodes, 6 connections. Senders deliver to your domains. Cloudflare Email Routing hands each message to the mail gateway, an Email Worker in your account, which stores it in D1 with its envelope recipient and wakes a notifier. The notifier tells Buun Mail over a WebSocket, and the gateway hands the message over and then forgets it.
Nodes:
- Senders (Any mail server), external
- Account: Your Cloudflare account
  - Email Routing (Catch-all), gateway
  - Mail gateway (Email Worker), function
  - D1 (Up to 30 days), database
  - Notifier (Durable Object), service
- Client side: Your computer
  - Buun Mail (Files by recipient), client
Connections:
- Senders to Email Routing: MX
- Email Routing to Mail gateway: catch-all
- Mail gateway to D1 (stored data line): stores
- Mail gateway to Notifier (dotted, asynchronous line): new mail
- Notifier to Buun Mail (dotted, asynchronous line): WebSocket
- Mail gateway to Buun Mail (stored data line): hands over</desc><metadata data-format="buun-diagram">flow "How the gateway fits together" direction=down animate=on desc="Senders deliver to your domains. Cloudflare Email Routing hands each message to the mail gateway, an Email Worker in your account, which stores it in D1 with its envelope recipient and wakes a notifier. The notifier tells Buun Mail over a WebSocket, and the gateway hands the message over and then forgets it."

node senders external "Senders" sub="Any mail server" icon=lucide:send

group cf "Your Cloudflare account" type=account provider=cloudflare {
  node routing gateway "Email Routing" sub="Catch-all" icon=cloudflare:email-routing
  node gateway function "Mail gateway" sub="Email Worker" icon=cloudflare:workers
  node d1 database "D1" sub="Up to 30 days" icon=cloudflare:d1
  node notifier service "Notifier" sub="Durable Object" icon=cloudflare:durable-objects
}

group desktop "Your computer" type=client-side {
  node app client "Buun Mail" sub="Files by recipient" icon=lucide:monitor
}

senders -&gt; routing : "MX"
routing -&gt; gateway : "catch-all"
gateway -&gt; d1 : "stores" role=data
gateway ..&gt; notifier : "new mail" role=async
notifier ..&gt; app : "WebSocket" role=async
gateway -&gt; app : "hands over" role=data
