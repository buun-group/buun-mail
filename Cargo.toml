[workspace]
resolver = "3"
members = ["crates/routing", "crates/message", "crates/store", "crates/rules", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

# Exact versions only: a bump is a deliberate change, never a silent one.
[workspace.dependencies]
buun-mail-routing = { path = "crates/routing" }
buun-mail-message = { path = "crates/message" }
buun-mail-store = { path = "crates/store" }
buun-mail-rules = { path = "crates/rules" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
toml = "=1.1.8"
toml_edit = "=0.25.19"
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-build = { version = "=2.7.4", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.1"
mail-parser = "=1.0.1"
mail-builder = "=2.0.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.12"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "rustls-tls"] }
base64 = "=0.23.1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
tiny_http = "=0.12.0"
getrandom = "=0.4.3"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
