[workspace]
resolver = "3"
members = ["crates/routing", "crates/message", "crates/store", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# Exact versions only: a bump is a deliberate change, never a silent one.
[workspace.dependencies]
buun-mail-routing = { path = "crates/routing" }
buun-mail-message = { path = "crates/message" }
buun-mail-store = { path = "crates/store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
toml = "=1.1.8"
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "=2.7.4", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
mail-parser = "=1.0.1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
