# Buun Mail routing file.
#
# Each workspace claims addresses with `match`: an exact address (`sales@acme.example`) or every address at a domain
# (`*@acme.example`). When both match, the exact address wins, whatever the order here. Mail nobody claims lands in
# Unsorted, so nothing is lost.
#
# Folders are picked by sender, first match wins. A message with no matching folder stays in the workspace inbox.
# The `id` is stored with every message: pick it once and never rename it.
#
# `icon` is optional on a workspace or a folder: briefcase, buildings, storefront, code, house, heart, rocket, palette,
# globe, leaf, camera, bag, wrench, game, cap, plane, receipt, bank, chart, cloud, github, bell, star, chat, at, or a
# product mark: buun, plotwork, flung, gunspec, dissolve, cryptflare. Without one, a workspace shows its initial.
# Settings can also give a workspace an image.
#
# Replace these examples with your own domains. Settings, Integrations adds a workspace for each domain you connect.

[[workspace]]
id = "acme"
name = "Acme"
icon = "briefcase"
match = ["*@acme.example"]
folders = [
  { name = "Billing", from = "*@stripe.com", icon = "receipt" },
  { name = "Infrastructure", from = "*@cloudflare.com", icon = "cloud" },
]

# An environment is its own workspace: mail to the staging domain stays apart from production.
[[workspace]]
id = "acme-staging"
name = "Acme staging"
icon = "wrench"
match = ["*@staging.acme.example"]

[[workspace]]
id = "side-project"
name = "Side project"
icon = "rocket"
match = ["*@globex.example"]
folders = [{ name = "GitHub", from = "notifications@github.com", icon = "github" }]

[[workspace]]
id = "personal"
name = "Personal"
icon = "house"
match = ["*@personal.example", "accounts@acme.example"]
folders = [{ name = "Receipts", from = "*@stripe.com", icon = "receipt" }]
